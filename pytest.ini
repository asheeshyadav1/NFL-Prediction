[pytest]
# The tests import `api` and `model_service` from the repo root. `python -m
# pytest` puts the working directory on sys.path so that resolves by accident,
# but bare `pytest tests/` (what CI runs) does not -- which is why the suite
# passed locally and failed in CI with ModuleNotFoundError: No module named
# 'api'. Setting pythonpath makes both invocations behave the same.
pythonpath = .
testpaths = tests
