# The whole site. There is no backend: scripts/export_static.py precomputes
# every projection and its retrieved context into public/data, so the only
# server-side code left is the narrator, which is one fetch and runs as a
# function.

[build]
  base = "frontend"
  command = "npm run build"
  # Relative to the repo root, not to `base` -- ".next" alone resolves to
  # <root>/.next and the build fails with "publish directory was not found".
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
