# Ingress fronts both the web app and the API under one host. The model service
# is deliberately NOT exposed -- it is reachable only from inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gridiron
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: gridiron.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 3000
