# Local cluster for the demo: `kind create cluster --config infra/k8s/kind-cluster.yaml`
# Maps host port 8080 to the ingress controller so the app is reachable at
# http://localhost:8080 without a cloud load balancer.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
