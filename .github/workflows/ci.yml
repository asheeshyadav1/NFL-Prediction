# CI/CD: test -> build images -> push -> deploy.
#
# Note: this lives at the repository root, not under infra/. GitHub only reads
# workflows from `.github/workflows/` at the root -- a workflow file under
# `infra/.github/workflows/` is never executed.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # The suite runs on synthetic data and a stubbed model service, so it
        # needs neither the nflverse download nor trained weights.
        run: pytest tests/ -q

      - name: Validate Kubernetes manifests
        run: |
          pip install kubernetes-validate pyyaml
          python - <<'PY'
          import glob, sys, yaml, kubernetes_validate
          failed = False
          for path in sorted(glob.glob("infra/k8s/*.yaml")):
              if "kind-cluster" in path:
                  continue  # kind config, not a Kubernetes resource
              for doc in yaml.safe_load_all(open(path)):
                  if not doc:
                      continue
                  try:
                      kubernetes_validate.validate(doc, "1.31", strict=True)
                      print(f"OK   {path} {doc['kind']}/{doc['metadata']['name']}")
                  except Exception as exc:
                      failed = True
                      print(f"FAIL {path} {doc.get('kind')}: {exc}")
          sys.exit(1 if failed else 0)
          PY

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  train:
    name: train model
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Cache nflverse data
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-2016-2024-v1

      - name: Train and evaluate
        run: python model/train.py

      - name: Fail if the model does not beat the naive baseline
        # The project's entire claim is "the model beats last-3-game average".
        # If that stops being true, the build should go red rather than ship.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path("model/artifacts/results.json").read_text())
          test = report["test"]
          print(f"baseline MAE {test['baseline_mae']:.3f} | model MAE {test['model_mae']:.3f} "
                f"| improvement {test['mae_improvement_pct']:.1f}%")
          if test["model_mae"] >= test["baseline_mae"]:
              sys.exit("model did not beat the naive baseline")
          PY

      - name: Upload trained weights and cached data
        # data/raw/ is gitignored, so a fresh checkout in the images job has no
        # nflverse parquet -- and Dockerfile.model copies it into the image so
        # the model service can build its feature store without network access.
        # Both paths ride along here; the artifact root is their common
        # ancestor (the repo root), so the download restores them in place.
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            model/artifacts/
            data/raw/
          retention-days: 14

  images:
    name: build and push images
    runs-on: ubuntu-latest
    needs: [test, frontend, train]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalise the image prefix
        # GHCR rejects uppercase image names, and `github.repository` keeps the
        # repository's own casing (this one has capitals). Lowercase it once
        # here so every later step builds a pushable tag.
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - name: Download trained weights and cached data
        # Restores model/artifacts/ and data/raw/ relative to the repo root.
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: .

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build model service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.model
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-model:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # The `secrets` context is not available in step-level `if:`, so presence
      # is surfaced through an env var and tested via the `env` context.
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalise the image prefix
        # GHCR rejects uppercase image names, and `github.repository` keeps the
        # repository's own casing (this one has capitals). Lowercase it once
        # here so every later step builds a pushable tag.
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      - name: Configure kubectl
        # Skipped when no cluster is configured, so the pipeline stays green on
        # a fork without secrets rather than failing on a missing credential.
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"

      - name: Roll out
        if: env.KUBE_CONFIG != ''
        run: |
          set -euo pipefail
          for f in infra/k8s/model-service.yaml infra/k8s/api.yaml infra/k8s/frontend.yaml; do
            sed -i "s|ghcr.io/OWNER/gridiron-|${REGISTRY}/${IMAGE_PREFIX}-|g; s|:latest|:${GITHUB_SHA}|g" "$f"
          done
          kubectl apply -f infra/k8s/model-service.yaml
          kubectl apply -f infra/k8s/api.yaml
          kubectl apply -f infra/k8s/frontend.yaml
          kubectl apply -f infra/k8s/ingress.yaml
          # Model service first: the gateway's readiness depends on it.
          kubectl rollout status deployment/model-service --timeout=10m
          kubectl rollout status deployment/api --timeout=5m
          kubectl rollout status deployment/frontend --timeout=5m

      - name: Note when deployment is skipped
        if: env.KUBE_CONFIG == ''
        run: echo "KUBE_CONFIG secret not set -- images built and pushed, deploy skipped."
